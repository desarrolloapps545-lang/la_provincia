<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informes la provincia</title>
    <link rel="icon" type="image/png" href="../image/logo_provincia.png">
    <link rel="stylesheet" href="../estilos.css">
    <link rel="stylesheet" href="informes.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="informesWorkspace">
        <nav class="status-bar">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="../image/logo_provincia.png" alt="Logo" style="height: 45px; width: auto;">
                <div class="nav-brand">Gestión la provincia</div>
            </div>
            <div class="nav-actions">
                <button id="btnInformeGanancias" class="nav-btn" style="background: #00b894;">Ganancias</button>
                <button id="btnInformeCompras" class="nav-btn" style="background: #0984e3;">Compras</button>
                <button id="btnInformeVentas" class="nav-btn" style="background: #e17055;">Ventas</button>
                <button id="btnInformePeso" class="nav-btn" style="background: #6c5ce7;">Peso Ent/Sal</button>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button onclick="window.location.href='../index.html'" class="nav-btn btn-cancel" style="margin: 0; padding: 5px 12px; font-size: 12px;">Volver al Inicio</button>
            </div>
        </nav>

        <main class="content-area">
            <div id="welcomeInformes" style="text-align: center; margin-top: 100px; color: #636e72;">
                <h3>Seleccione el informe que desea consultar</h3>
            </div>

            <section id="informeGananciasView" class="view-section hidden">
                <div class="view-header">
                    <h3>Informe de Ganancias</h3>
                </div>
                <div class="filter-section">
                    <label>Producto:</label>
                    <select id="gananciasProductSelect">
                        <option value="todos">Todos</option>
                        <option value="">Cargando productos...</option>
                    </select>
                    <label>Desde:</label>
                    <input type="date" id="gananciasDateStart">
                    <label>Hasta:</label>
                    <input type="date" id="gananciasDateEnd">
                    <button class="action-btn" onclick="generarInformeGanancias()">Generar Informe</button>
                    <button id="btnDescargarGanancias" class="action-btn hidden" onclick="exportCurrentTableToExcel('informe_ganancias.xlsx', 'Ganancias')">Descargar Excel</button>
                </div>
                <div id="gananciasResultContainer" class="table-container"></div>
            </section>

            <section id="informeComprasView" class="view-section hidden">
                <div class="view-header">
                    <h3>Informe de Compras</h3>
                </div>
                <div class="filter-section">
                    <label>Producto:</label>
                    <select id="comprasProductSelect">
                        <option value="todos">Todos</option>
                        <option value="">Cargando productos...</option>
                    </select>
                    <label>Desde:</label>
                    <input type="date" id="comprasDateStart">
                    <label>Hasta:</label>
                    <input type="date" id="comprasDateEnd">
                    <button class="action-btn" onclick="generarInformeCompras()">Generar Informe</button>
                    <button id="btnDescargarCompras" class="action-btn hidden" onclick="exportCurrentTableToExcel('informe_compras.xlsx', 'Compras')">Descargar Excel</button>
                </div>
                <div id="comprasResultContainer" class="table-container"></div>
            </section>

            <section id="informeVentasView" class="view-section hidden">
                <div class="view-header">
                    <h3>Informe de Ventas</h3>
                </div>
                <div class="filter-section">
                    <label>Producto:</label>
                    <select id="ventasProductSelect">
                        <option value="todos">Todos</option>
                        <option value="">Cargando productos...</option>
                    </select>
                    <label>Desde:</label>
                    <input type="date" id="ventasDateStart">
                    <label>Hasta:</label>
                    <input type="date" id="ventasDateEnd">
                    <button class="action-btn" onclick="generarInformeVentas()">Generar Informe</button>
                    <button id="btnDescargarVentas" class="action-btn hidden" onclick="exportCurrentTableToExcel('informe_ventas.xlsx', 'Ventas')">Descargar Excel</button>
                </div>
                <div id="ventasResultContainer" class="table-container"></div>
            </section>

            <section id="informePesoView" class="view-section hidden">
                <div class="view-header">
                    <h3>Informe de Peso de Entrada y Salida</h3>
                </div>
                <div class="filter-section">
                    <label>Producto:</label>
                    <select id="pesoProductSelect">
                        <option value="todos">Todos</option>
                        <option value="">Cargando productos...</option>
                    </select>
                    <label>Desde:</label>
                    <input type="date" id="pesoDateStart">
                    <label>Hasta:</label>
                    <input type="date" id="pesoDateEnd">
                    <button class="action-btn" onclick="generarInformePeso()">Generar Informe</button>
                    <button id="btnDescargarPeso" class="action-btn hidden" onclick="exportCurrentTableToExcel('informe_peso.xlsx', 'Peso Ent/Sal')">Descargar Excel</button>
                </div>
                <div id="pesoResultContainer" class="table-container"></div>
            </section>
        </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="informes.js"></script>
</body>
</html>
