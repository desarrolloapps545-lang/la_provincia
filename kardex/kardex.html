<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kardex la provincia</title>
    <link rel="icon" type="image/png" href="../image/logo_provincia.png">
    <link rel="stylesheet" href="kardex.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="kardex-container">
        <header class="kardex-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="../image/logo_provincia.png" alt="Logo" style="height: 45px; width: auto;">
                <h2>Kardex</h2>
            </div>
        </header>

        <div class="filter-section">
            <label for="farmSelect">Filtrar por Granja:</label>
            <select id="farmSelect">
                <option value="">-- Todas las granjas --</option>
            </select>

            <label for="productSelect">Seleccione Producto:</label>
            <select id="productSelect">
                <option value="">Cargando productos...</option>
            </select>
        </div>

        <div class="table-container">
            <table id="kardexTable">
                <thead>
                    <tr>
                        <th>Fecha Movimiento</th>
                        <th>Granja</th>
                        <th>Detalle</th>
                        <th>Justificación</th>
                        <th>Entradas</th>
                        <th>Salidas</th>
                        <th>Saldo Existencias</th>
                    </tr>
                </thead>
                <tbody id="kardexBody">
                    <tr><td colspan="7" style="text-align:center;">Seleccione un producto para ver sus movimientos</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Contenedor para notificaciones temporales -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="kardex.js"></script>
</body>
</html>
